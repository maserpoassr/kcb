name: Build APK

# 一键构建可安装的 APK（含“教务课表自动同步”改动）。
#
# 产物说明：
#   - debug   ：Debug 签名，体积略大，最稳，适合日常测试。
#   - release ：Debug 签名（androidApp 的 release buildType 默认用 debug 签名）+ R8 压缩，
#               体积更小，适合日常使用；因与原版签名不同，安装前需先卸载官方版本。
#
# 手动触发：Actions → Build APK → Run workflow → 选择构建类型。

on:
  workflow_dispatch:
    inputs:
      variant:
        description: '构建类型 (both / debug / release)'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - debug
          - release
  push:
    branches:
      - main
      - master
      - dev

env:
  VARIANT: ${{ github.event.inputs.variant || 'both' }}

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 设置 Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 校验离线适配资源存在
        run: |
          echo "===== 离线资源 ====="
          find shared/assets/offline_repo -type f | sort
          test -f shared/assets/offline_repo/index/school_index.pb || (echo "缺少 school_index.pb" && exit 1)
          test -f shared/assets/offline_repo/schools/resources/PEU/peu_01.js || (echo "缺少 PEU 适配脚本" && exit 1)

      - name: 授予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 构建 Debug APK
        if: env.VARIANT == 'both' || env.VARIANT == 'debug'
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: 构建 Release APK
        if: env.VARIANT == 'both' || env.VARIANT == 'release'
        run: ./gradlew :androidApp:assembleRelease --stacktrace

      - name: 上传 Debug APK
        if: env.VARIANT == 'both' || env.VARIANT == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: 上传 Release APK
        if: env.VARIANT == 'both' || env.VARIANT == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
